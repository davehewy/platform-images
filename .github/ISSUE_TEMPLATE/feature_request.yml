name: Feature request
description: Propose a container dependency, change-detection, or CI orchestration improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the repository-owner or platform-team problem, including why existing configuration is insufficient.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what the tool should decide, generate, or execute.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Worked example
      description: A small directory tree, Dockerfile relationship, Git diff, or desired generated job is especially useful.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a similar request.
          required: true

