name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Check out main with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm main is the commit tested by CI
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Determine and create semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload distributions to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@5a5718ce47b892ef699f2972dae122297771d641 # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Retain distributions as workflow artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-images-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error

  standalone:
    name: Standalone ${{ matrix.platform }}
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
            os: linux
            arch: amd64
            python_arch: x64
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
            python_arch: arm64
          - platform: darwin-amd64
            runner: macos-15-intel
            os: darwin
            arch: amd64
            python_arch: x64
          - platform: darwin-arm64
            runner: macos-14
            os: darwin
            arch: arm64
            python_arch: arm64
          - platform: windows-amd64
            runner: windows-2025
            os: windows
            arch: amd64
            python_arch: x64
          - platform: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install native Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Install standalone build dependencies
        run: uv sync --python "${{ steps.python.outputs.python-path }}" --locked --extra release

      - name: Build and smoke-test standalone archive
        run: >-
          uv run --locked --extra release python scripts/build-standalone.py
          --version "${{ needs.release.outputs.version }}"
          --os "${{ matrix.os }}"
          --arch "${{ matrix.arch }}"
          --output-dir standalone-dist

      - name: Retain standalone archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.platform }}
          path: standalone-dist/platform-images-*
          if-no-files-found: error

  publish-standalone:
    name: Publish standalone archives
    needs: [release, standalone]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download standalone archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: standalone-dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: standalone-dist
        run: sha256sum platform-images-* > SHA256SUMS

      - name: Attach standalone archives to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" standalone-dist/* --clobber

  verify-installer:
    name: Verify installer ${{ matrix.platform }}
    needs: [release, publish-standalone]
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
            os: linux
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
          - platform: darwin-amd64
            runner: macos-15-intel
            os: darwin
          - platform: darwin-arm64
            runner: macos-14
            os: darwin
          - platform: windows-amd64
            runner: windows-2025
            os: windows
          - platform: windows-arm64
            runner: windows-11-arm
            os: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out released installers and example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install and exercise the POSIX release
        if: matrix.os != 'windows'
        shell: bash
        env:
          PLATFORM_IMAGES_VERSION: ${{ needs.release.outputs.version }}
          PLATFORM_IMAGES_INSTALL_DIR: ${{ runner.temp }}/platform-images-bin
          PLATFORM_IMAGES_ROOT: ${{ github.workspace }}
        run: |
          sh scripts/install.sh
          "${PLATFORM_IMAGES_INSTALL_DIR}/platform" images validate
          "${PLATFORM_IMAGES_INSTALL_DIR}/platform" images graph

      - name: Install and exercise the Windows release
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          PLATFORM_IMAGES_VERSION: ${{ needs.release.outputs.version }}
          PLATFORM_IMAGES_INSTALL_DIR: ${{ runner.temp }}\platform-images-bin
          PLATFORM_IMAGES_ROOT: ${{ github.workspace }}
        run: |
          & .\scripts\install.ps1
          & (Join-Path $env:PLATFORM_IMAGES_INSTALL_DIR "platform.exe") images validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:PLATFORM_IMAGES_INSTALL_DIR "platform.exe") images graph
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
