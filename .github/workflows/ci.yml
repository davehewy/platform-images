name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lockfile and install project
        run: uv sync --locked --extra dev

      - name: Run pre-commit file checks
        run: uv run --locked --extra dev pre-commit run --all-files --show-diff-on-failure

      - name: Run unit and functional test suite
        run: uv run --locked --extra dev pytest -m "not integration" -q

      - name: Battle-test 360-image imperfect graph and CI generation
        run: >-
          uv run --locked python scripts/benchmark-graph.py
          --scenario imperfect --images 360 --iterations 7
          --max-validate-ms 750 --max-leaf-plan-ms 75
          --max-graph-render-ms 75 --max-ci-render-ms 750

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --extra dev cz check --message "$PR_TITLE"

      - name: Build wheel and source distribution
        run: uv build

  container-engine-integration:
    name: Docker, Podman, Buildah, and nerdctl integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONTAINERD_ADDRESS: /run/platform-images-containerd/containerd.sock
      BUILDKIT_HOST: unix:///run/platform-images-buildkit/buildkitd.sock
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python and project
        run: |
          uv python install 3.12
          uv sync --locked --extra dev

      - name: Verify Docker Buildx and install containers-storage backends
        run: |
          docker info
          docker buildx version
          sudo apt-get update
          sudo apt-get install --yes buildah podman
          podman info
          buildah info

      - name: Install pinned nerdctl full distribution
        env:
          NERDCTL_VERSION: "2.3.5"
          NERDCTL_FULL_LINUX_AMD64_SHA256: b697295c623639734aaab737523c808fd3cc8d3046039fd94fff1744e4c317aa
        run: |
          archive="nerdctl-full-${NERDCTL_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/${archive}"
          printf '%s  %s\n' "$NERDCTL_FULL_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          sudo install -d /opt/platform-images-nerdctl
          sudo tar -xzf "${archive}" -C /opt/platform-images-nerdctl
          printf '%s\n' \
            '#!/bin/sh' \
            'exec sudo --preserve-env=CONTAINERD_ADDRESS,BUILDKIT_HOST env PATH=/opt/platform-images-nerdctl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin /opt/platform-images-nerdctl/bin/nerdctl "$@"' |
            sudo tee /usr/local/bin/nerdctl >/dev/null
          sudo chmod 0755 /usr/local/bin/nerdctl
          sudo install -d \
            /run/platform-images-buildkit \
            /run/platform-images-containerd \
            /var/lib/platform-images-buildkit \
            /var/lib/platform-images-containerd
          sudo systemd-run \
            --unit=platform-images-containerd \
            --property=Restart=on-failure \
            --setenv=PATH=/opt/platform-images-nerdctl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
            -- /opt/platform-images-nerdctl/bin/containerd \
            --address "$CONTAINERD_ADDRESS" \
            --state /run/platform-images-containerd/state \
            --root /var/lib/platform-images-containerd
          sudo systemd-run \
            --unit=platform-images-buildkit \
            --property=Restart=on-failure \
            --setenv=PATH=/opt/platform-images-nerdctl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
            -- /opt/platform-images-nerdctl/bin/buildkitd \
            --addr "$BUILDKIT_HOST" \
            --root /var/lib/platform-images-buildkit
          for attempt in $(seq 1 30); do
            if sudo test -S "$CONTAINERD_ADDRESS" && \
              sudo test -S "${BUILDKIT_HOST#unix://}"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              sudo journalctl -u platform-images-containerd -u platform-images-buildkit --no-pager
              exit 1
            fi
            sleep 1
          done
          sudo chmod a+rw "$CONTAINERD_ADDRESS" "${BUILDKIT_HOST#unix://}"
          nerdctl version
          nerdctl info
          /opt/platform-images-nerdctl/bin/buildctl --version
          /opt/platform-images-nerdctl/bin/buildctl debug workers

      - name: Exercise real base-to-dependent build
        run: uv run --locked --extra dev pytest -m integration -q
