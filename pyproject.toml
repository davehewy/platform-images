[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "platform-images"
version = "0.1.0"
description = "Dependency-aware orchestration for container-image monorepos and dynamic GitLab pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "David Heward", email = "dave@bytewire.co.uk" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["containers", "dependency-graph", "devops", "gitlab-ci", "monorepo", "podman"]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = [
  "commitizen>=4.17.0,<5",
  "pre-commit>=4.6.2,<5",
  "pytest>=8.3",
  "python-semantic-release>=10.6.1,<11",
  "ruff>=0.9",
]

[project.scripts]
platform = "platform_images.cli:main"

[project.urls]
Repository = "https://github.com/davehewy/platform-images"
Issues = "https://github.com/davehewy/platform-images/issues"
Releases = "https://github.com/davehewy/platform-images/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_images"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires a working Podman service and network access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/platform_images/__init__.py:__version__"]
assets = ["uv.lock"]
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
build_command = "python scripts/build-release.py"
no_git_verify = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
