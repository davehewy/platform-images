[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "platform-images"
version = "0.1.0"
description = "Convention-driven container image controller"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
platform = "platform_images.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_images"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: requires a working Podman service and network access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
